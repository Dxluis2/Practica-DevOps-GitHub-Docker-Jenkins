
name: CI/CD Agenda Escolar DevOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-y-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Construir imagen Docker
        run: docker build -t control-visitas:ci .

      - name: Verificar imagen Docker
        run: docker image inspect control-visitas:ci

      - name: Confirmar integracion continua
        run: echo "Pruebas y construccion Docker completadas correctamente"
